<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ValOpti — The Draft Maker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout : barre de navigation fixe façon client de jeu, contenu en grille principale + colonne latérale (inspiration rib.gg),
   angles vifs et coins biseautés repris de l'UI Valorant, motif hexagonal du logo pour les graphes. */
:root{
  color-scheme: dark;
  --bg:#0F1923;        /* bleu nuit Valorant / fond du logo */
  --panel:#16222E;     /* intérieur de l'hexagone */
  --panel-2:#1C2A38;
  --raise:#24354A;
  --line:rgba(236,232,225,.09);
  --line-2:rgba(236,232,225,.2);
  --fg:#ECE8E1;        /* sable */
  --muted:#9AA5B1;
  --dim:#66737F;
  --red:#FF4655;       /* rouge Valorant */
  --red-ink:#FF6B77;
  --red-dim:rgba(255,70,85,.14);
  --teal:#3BD6C2;      /* camp défenseur, valeur haute */
  --teal-dim:rgba(59,214,194,.13);
  --amber:#F2C14E;
  --duel:#FF8A5B; --init:#E8C468; --ctrl:#93A9FF; --sent:#4FD1B8; --flex:#C9B8FF;
  --f-display:'Teko','Oswald','Arial Narrow',sans-serif;
  --f-body:'Barlow','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --notch:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);
  --notch-s:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(15,25,35,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:60px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand svg{width:34px;height:34px}
.wordmark{font-weight:700;letter-spacing:.32em;font-size:15px}
.wordmark .o{background:linear-gradient(90deg,var(--fg) 50%,var(--red) 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.wordmark .r{color:var(--red)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{font-family:var(--f-display);font-size:19px;letter-spacing:.04em;text-transform:uppercase;padding:14px 12px 10px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;line-height:1}
.nav a:hover{color:var(--fg)}
.nav a.on{color:var(--fg);border-bottom-color:var(--red)}
.search{position:relative;flex-shrink:0}
.search input{width:220px;background:var(--panel);border:1px solid var(--line);padding:8px 10px 8px 32px;font-size:13px}
.search input::placeholder{color:var(--dim)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--dim)}
.sres{position:absolute;right:0;top:calc(100% + 6px);width:300px;background:var(--panel-2);border:1px solid var(--line-2);z-index:70;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.sres button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 12px;background:none;border:0;text-align:left;cursor:pointer;border-bottom:1px solid var(--line)}
.sres button:hover,.sres button:focus-visible{background:var(--raise)}
.sres .k{font-size:11px;color:var(--dim);margin-left:auto;text-transform:uppercase;letter-spacing:.08em}
@media (max-width:860px){
  .top .wrap{flex-wrap:wrap;height:auto;gap:4px 12px;padding-block:8px 0}
  .search{order:2;margin-left:auto}
  .search input{width:150px}
  .nav{order:3;flex-basis:100%}
  .wordmark{display:none}
}

/* ---------- Generic ---------- */
main{padding-block:24px 48px}
.view{display:flex;flex-direction:column;gap:24px}
.h-eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--red-ink);font-weight:600}
.h1{font-family:var(--f-display);font-weight:600;font-size:clamp(40px,6vw,64px);line-height:.9;text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
.h2{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1;text-transform:uppercase;letter-spacing:.03em;margin:0;display:flex;align-items:center;gap:10px}
.h2::before{content:"";width:8px;height:8px;background:var(--red);transform:rotate(45deg);flex-shrink:0;margin-top:-4px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line)}
.pad{padding:16px}
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:1040px){.grid-main{grid-template-columns:minmax(0,1fr)}}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.grid-2{grid-template-columns:minmax(0,1fr)}}
#pr-out{display:flex;flex-direction:column;gap:24px}
.stack{display:flex;flex-direction:column;gap:24px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;border:0;padding:11px 18px 10px;font-family:var(--f-display);font-size:19px;letter-spacing:.06em;text-transform:uppercase;line-height:1;cursor:pointer;clip-path:var(--notch-s)}
.btn:hover{background:#ff5d6a}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2);clip-path:none}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{font-size:16px;padding:8px 12px 7px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{color:var(--fg);cursor:pointer;background:none;border:0;padding:0;text-align:left}
.link:hover{color:var(--red-ink)}
.ctry{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);padding:1px 4px;line-height:1.3;display:inline-block;flex-shrink:0}
.tag{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px 2px;line-height:1.3;white-space:nowrap}
.pill.fa{background:var(--teal-dim);color:var(--teal)}
.pill.rk{background:rgba(242,193,78,.14);color:var(--amber)}
.pill.ct{background:rgba(236,232,225,.07);color:var(--muted)}
.pill.vct{background:var(--red-dim);color:var(--red-ink)}
.role{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.role svg{width:14px;height:14px;flex-shrink:0}
.achip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 7px 1px;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap}
.achip i{width:6px;height:6px;display:inline-block;transform:rotate(45deg)}
.src{display:none;font-family:var(--f-mono);font-size:10px;color:var(--amber);border:1px dashed rgba(242,193,78,.5);padding:1px 5px;letter-spacing:0}
body.dev .src{display:inline-block}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.wl{display:inline-grid;place-items:center;width:18px;height:18px;font-size:11px;font-weight:700}
.wl.w{background:var(--teal-dim);color:var(--teal)}
.wl.l{background:var(--red-dim);color:var(--red-ink)}
.seg{display:inline-flex;border:1px solid var(--line-2)}
.seg button{background:none;border:0;padding:7px 12px 6px;font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--muted);cursor:pointer;text-transform:uppercase}
.seg button.on{background:var(--fg);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.field input,.field select{background:var(--panel-2);border:1px solid var(--line);padding:8px 10px;min-width:0;width:100%}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:12px}
@media (max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters .field:first-child{grid-column:1/-1}}

/* ---------- Tables ---------- */
.tscroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;text-align:right;padding:10px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--panel)}
.tbl th.l,.tbl td.l{text-align:left}
.tbl th[data-sort]{cursor:pointer}
.tbl th[data-sort]:hover{color:var(--fg)}
.tbl th.sorted{color:var(--fg)}
.tbl th.sorted::after{content:" ▾";color:var(--red)}
.tbl th.sorted.asc::after{content:" ▴"}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background-color:var(--panel-2)}
.tbl td.hl{font-weight:700}
.pcell{display:flex;align-items:center;gap:8px;min-width:150px}
.pcell b{font-weight:600}
.pcell small{color:var(--dim);font-size:12px}

/* ---------- Home ---------- */
.hero{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) 280px;align-items:center;gap:24px;padding:32px clamp(18px,4vw,40px)}
.hero p{max-width:56ch;color:var(--muted);font-size:16px;margin:14px 0 22px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.hero-mark{width:100%;max-width:280px}
.hero::after{content:"";position:absolute;right:-120px;top:-80px;width:420px;height:420px;background:radial-gradient(closest-side,rgba(255,70,85,.10),transparent);pointer-events:none}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero-mark{display:none}}
.kpis{display:flex;gap:28px;flex-wrap:wrap;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.kpis div b{display:block;font-family:var(--f-display);font-size:34px;line-height:.9;font-weight:600}
.kpis div span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.up-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.up{background:var(--panel);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;transition:border-color .15s}
.up:hover{border-color:var(--line-2)}
.up .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);gap:8px}
.up .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.up .tm{display:flex;flex-direction:column;gap:2px;min-width:0}
.up .tm.r{text-align:right}
.up .tm b{font-family:var(--f-display);font-size:24px;line-height:.9;font-weight:600;letter-spacing:.02em}
.up .tm small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up .vs{font-size:11px;color:var(--dim);letter-spacing:.1em}
.pbar{display:flex;height:6px;gap:2px}
.pbar i{display:block;height:100%}
.pbar i:first-child{background:var(--red)}
.pbar i:last-child{background:var(--fg);opacity:.75}
.up .pct{display:flex;justify-content:space-between;font-weight:700;font-size:13px}
.up .hint{font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.res-row{display:grid;grid-template-columns:62px minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.res-row:last-child{border-bottom:0}
.res-row .d{font-size:12px;color:var(--dim)}
.res-row .t{display:flex;align-items:center;gap:8px;min-width:0}
.res-row .t.r{justify-content:flex-end;text-align:right}
.res-row .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-row .t.win span{font-weight:700}
.res-row .t.lose span{color:var(--muted)}
.res-row .sc{font-family:var(--f-display);font-size:24px;line-height:1;font-weight:600;display:flex;gap:6px;align-items:center}
.res-row .sc .w{color:var(--fg)} .res-row .sc .l{color:var(--dim)}
.res-row .maps{grid-column:2/-1;font-size:12px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap}
.res-row .ev{grid-column:2/-1;font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:-4px}
.side-list{display:flex;flex-direction:column}
.side-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.side-row:last-child{border-bottom:0}
.side-row:hover{background:var(--panel-2)}
.side-row .n{font-family:var(--f-display);font-size:20px;color:var(--dim);line-height:1}
.side-row .nm{display:flex;align-items:center;gap:8px;min-width:0}
.side-row .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.side-row .v{font-weight:700;font-variant-numeric:tabular-nums}
.side-row .v small{display:block;font-weight:400;color:var(--dim);font-size:11px;text-align:right}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);gap:8px}
.card-h h3{margin:0;font-family:var(--f-display);font-size:21px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;line-height:1}

/* ---------- Draft ---------- */
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:980px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.slots{grid-template-columns:minmax(0,1fr)}}
.slot{background:var(--panel);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;cursor:pointer;min-height:188px;position:relative;text-align:left;clip-path:var(--notch)}
.slot:hover{border-color:var(--line-2)}
.slot.sel{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.slot .sr{display:flex;justify-content:space-between;align-items:center}
.slot .ign{font-family:var(--f-display);font-size:30px;line-height:.85;font-weight:600;letter-spacing:.02em;word-break:break-word}
.slot .info{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.slot .big{display:flex;gap:14px;font-variant-numeric:tabular-nums}
.slot .big div span{display:block;font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.slot .big div b{font-size:17px}
.slot select{background:var(--panel-2);border:1px solid var(--line);padding:6px 8px;width:100%;font-size:13px;margin-top:auto}
.slot .x{position:absolute;right:8px;top:8px;width:24px;height:24px;display:grid;place-items:center;background:none;border:0;color:var(--dim);cursor:pointer;font-size:18px;line-height:1}
.slot .x:hover{color:var(--red)}
.slot.emptyslot{justify-content:center;align-items:center;border-style:dashed;color:var(--dim);text-align:center}
.slot.emptyslot .plus{font-family:var(--f-display);font-size:42px;line-height:.7;color:var(--line-2)}
.draft-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:1040px){.draft-grid{grid-template-columns:minmax(0,1fr)}}
.pool-f{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
@media (max-width:560px){.pool-f{grid-template-columns:1fr 1fr}.pool-f .field:first-child{grid-column:1/-1}}
.pool{max-height:560px;overflow-y:auto}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 92px 50px 46px 34px;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.prow.in{opacity:.38}
.prow .r{text-align:right}
.prow .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.prow .who .l1{display:flex;gap:7px;align-items:center;min-width:0}
.prow .who .l1 button{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .who .l2{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--dim);min-width:0;white-space:nowrap;overflow:hidden}
.prow .add{width:30px;height:30px;background:var(--panel-2);border:1px solid var(--line-2);cursor:pointer;font-size:18px;line-height:1;display:grid;place-items:center}
.prow .add:hover{background:var(--red);border-color:var(--red);color:#fff}
.prow-h{font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;padding:8px 14px;border-bottom:1px solid var(--line-2)}
@media (max-width:480px){.prow{grid-template-columns:minmax(0,1fr) 50px 46px 34px}.prow .rolec{display:none}}
.score-top{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;align-items:center;padding:16px}
.ring{position:relative;width:120px;height:120px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-family:var(--f-display);font-size:50px;line-height:.8;font-weight:600;display:block}
.ring .v span{font-size:9px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-r{display:grid;grid-template-columns:112px minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:12px}
.bar-r span{color:var(--muted)}
.bar-r .tr{height:6px;background:var(--panel-2);position:relative}
.bar-r .tr i{position:absolute;inset:0 auto 0 0;background:var(--fg)}
.bar-r b{text-align:right;font-variant-numeric:tabular-nums}
.mapstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mapcell{padding:8px 4px 6px;text-align:center;background:var(--panel-2);display:flex;flex-direction:column;gap:2px}
.mapcell span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapcell b{font-variant-numeric:tabular-nums;font-size:15px}
@media (max-width:520px){.mapstrip{grid-template-columns:repeat(4,minmax(0,1fr))}}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;font-size:13px;padding:7px 10px;background:var(--panel-2);align-items:start}
.alert i{width:8px;height:8px;margin-top:6px;transform:rotate(45deg)}
.alert.crit i{background:var(--red)} .alert.warn i{background:var(--amber)} .alert.info i{background:var(--muted)} .alert.ok i{background:var(--teal)}
.saved{display:flex;flex-direction:column}
.saved-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.saved-row:last-child{border-bottom:0}
.saved-row small{display:block;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-row b{font-weight:600}
.saverow{display:flex;gap:8px;flex-wrap:wrap}
.saverow input{flex:1;min-width:160px;background:var(--panel-2);border:1px solid var(--line);padding:8px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;font-weight:600;z-index:90;font-size:13px}

/* ---------- Predictions ---------- */

footer{border-top:1px solid var(--line);padding-block:20px 28px;color:var(--dim);font-size:12px}

<script>
/* =====================================================================
   1. DONNÉES DE DÉMO — calquées sur le schéma (teams, players, agents,
      game_maps, matches, match_maps, player_stats_snapshot,
      player_agent_stats, player_team_membership, team_rankings)
   ===================================================================== */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = mulberry(20261023);
const gauss = ()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const pick = a => a[Math.floor(R()*a.length)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const mean = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : 0;
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[b[i],b[j]]=[b[j],b[i]]} return b; };

const ROLES = ['duelist','initiator','controller','sentinel'];
const ROLE_FR = {duelist:'Duelliste',initiator:'Initiateur',controller:'Contrôleur',sentinel:'Sentinelle',flex:'Flex'};
const ROLE_COLOR = {duelist:'var(--duel)',initiator:'var(--init)',controller:'var(--ctrl)',sentinel:'var(--sent)',flex:'var(--flex)'};

const AGENTS = [
  ['Jett','duelist'],['Raze','duelist'],['Reyna','duelist'],['Phoenix','duelist'],['Yoru','duelist'],['Neon','duelist'],['Iso','duelist'],['Waylay','duelist'],
  ['Sova','initiator'],['Fade','initiator'],['Skye','initiator'],['Breach','initiator'],['KAY/O','initiator'],['Gekko','initiator'],['Tejo','initiator'],
  ['Omen','controller'],['Viper','controller'],['Astra','controller'],['Brimstone','controller'],['Harbor','controller'],['Clove','controller'],
  ['Killjoy','sentinel'],['Cypher','sentinel'],['Sage','sentinel'],['Chamber','sentinel'],['Deadlock','sentinel'],['Vyse','sentinel'],
].map(([name,role],i)=>({agent_id:i+1,name,role}));
const AG = Object.fromEntries(AGENTS.map(a=>[a.agent_id,a]));

const MAPS = ['Ascent','Bind','Haven','Lotus','Split','Sunset','Icebox'].map((name,i)=>({map_id:i+1,name}));
const MP = Object.fromEntries(MAPS.map(m=>[m.map_id,m]));

const REGION_CTRY = {EMEA:['fr','se','es','de','tr','gb','pl'],Americas:['us','br','ca'],Pacific:['kr','jp','ph'],China:['cn']};
const NAMES = {
  fr:[['Lucas','Théo','Nathan','Hugo','Enzo','Maxime','Antoine','Yanis','Rayan','Mathis'],['Moreau','Garnier','Roux','Lefèvre','Fontaine','Chevalier','Mercier','Blanc','Girard','Perrin']],
  se:[['Erik','Oskar','Linus','Viktor','Axel'],['Lindqvist','Berg','Holm','Sjöberg','Nyström']],
  es:[['Pablo','Álvaro','Javier','Iker','Diego'],['García','Navarro','Ortega','Romero','Molina']],
  de:[['Jonas','Leon','Felix','Niklas','Paul'],['Schmidt','Becker','Wagner','Hoffmann','Krüger']],
  tr:[['Emre','Burak','Kaan','Mert','Arda'],['Yılmaz','Demir','Kaya','Şahin','Çelik']],
  gb:[['Oliver','Harry','Jack','Charlie','Alfie'],['Taylor','Evans','Hughes','Wright','Turner']],
  pl:[['Jakub','Kacper','Szymon','Filip','Bartosz'],['Nowak','Kowalski','Wójcik','Kamiński','Zieliński']],
  us:[['Ethan','Mason','Tyler','Jordan','Cole'],['Miller','Carter','Hayes','Brooks','Reed']],
  br:[['Gabriel','Pedro','Matheus','Rafael','Thiago'],['Silva','Souza','Oliveira','Costa','Almeida']],
  ca:[['Liam','Noah','Owen','Félix','Logan'],['Tremblay','Gagnon','Bouchard','Wilson','Roy']],
  kr:[['Min-jun','Ji-ho','Seo-jun','Do-hyun','Ha-jun'],['Kim','Park','Lee','Choi','Jung']],
  jp:[['Haruto','Ren','Sota','Yuto','Riku'],['Sato','Takahashi','Nakamura','Kobayashi','Ito']],
  ph:[['Miguel','Paolo','Carlo','Jericho','Marco'],['Santos','Reyes','Cruz','Bautista','Villanueva']],
  cn:[['Hao','Jun','Wei','Zhi','Yu'],['Wang','Li','Zhang','Liu','Chen']],
};
const HANDLES = shuffle(['Vexil','Kairo','Snowdrift','Tsubame','Halcyon','Zephr','Onyx','Brisk','Pyra','Leto','Quill','Ravn','Sable','Torque','Umbra','Vanta','Wisp','Ardent','Blitzen','Cinder','Drako','Fenrir','Ghosty','Hask','Ivo','Kestrel','Lumen','Marrow','Nyx','Orin','Peregrine','Quasar','Rift','Stryx','Tamsin','Ulric','Valk','Wraithe','Xeno','Yaro','Zinc','Aster','Bastion','Corvo','Dusk','Flint','Gale','Hollow','Ion','Jolt','Koiwa','Lark','Moraine','Nimbus','Oakley','Pike','Rune','Silt','Thorne','Vesper','Wren','Zora','Axiom','Crux','Sorel','Tidal','Kyro','Mistral','Obsid','Pallas','Riven','Sirocco','Talon','Velo','Yonder','Cassio','Draven','Fable','Glint','Hexa','Ilex','Juno','Kepler','Lyric','Mosaic','Nadir','Ostra']);
const PAST_ORGS = ['Orbit Academy','Night Owls','Static Bloom','Paper Lions','Northwind Academy','Glasshouse','Eclipse Premier','Saltwater','Kilowatt','Moonrise Academy'];

const TEAMS = [
  [1,'Helix Pantheon','HLX','fr','EMEA','VCT',2010],
  [2,'Nordlys','NRD','se','EMEA','VCT',1935],
  [3,'Iron Lotus','ILT','kr','Pacific','VCT',2045],
  [4,'Kitsune Vanguard','KSV','jp','Pacific','VCT',1900],
  [5,'Sol Invicta','SOL','br','Americas','VCT',1985],
  [6,'Arcturus Gaming','ARC','us','Americas','VCT',1955],
  [7,'Red Meridian','RMD','cn','China','VCT',1925],
  [8,'Lynx Collective','LYX','fr','EMEA','Challengers',1745],
  [9,'Brava Esports','BRV','es','EMEA','Challengers',1690],
  [10,'Polar Shift','PLS','de','EMEA','Challengers',1640],
  [11,'Ember Rush','EMB','ca','Americas','Challengers',1710],
  [12,'Tidecallers','TDC','ph','Pacific','Challengers',1665],
  [13,'Jade Tempest','JDT','cn','China','Challengers',1620],
].map(([team_id,name,short_tag,country_code,region,tier,elo])=>({team_id,vlr_team_id:2000+team_id*7,name,short_tag,country_code,region,tier,elo,
  aff:Object.fromEntries(MAPS.map(m=>[m.map_id,gauss()*55])), roster:[], matches:[], mapRec:{} }));
const TM = Object.fromEntries(TEAMS.map(t=>[t.team_id,t]));

const ROLE_BASE = {
  duelist:{acs:228,kpr:.80,apr:.20,fkpr:.17,fdpr:.13,kast:70,hs:27,adr:150},
  initiator:{acs:200,kpr:.71,apr:.36,fkpr:.09,fdpr:.08,kast:74,hs:25,adr:132},
  controller:{acs:188,kpr:.67,apr:.33,fkpr:.06,fdpr:.07,kast:74,hs:24,adr:124},
  sentinel:{acs:196,kpr:.71,apr:.23,fkpr:.08,fdpr:.07,kast:72,hs:26,adr:129},
};
function makeStats(role,r,rounds){
  const b=ROLE_BASE[role], d=r-1;
  const kpr=b.kpr+d*.55+gauss()*.02, dpr=.70-d*.35+gauss()*.02;
  return {rounds_played:rounds,rating:r,acs:b.acs+d*240+gauss()*7,kd:kpr/dpr,kast_pct:clamp(b.kast+d*18+gauss()*1.8,58,86),
    adr:b.adr+d*150+gauss()*5,kpr,apr:Math.max(.1,b.apr+d*.1+gauss()*.03),fkpr:Math.max(.02,b.fkpr+d*.08+gauss()*.015),
    fdpr:Math.max(.03,b.fdpr-d*.04+gauss()*.012),hs_pct:clamp(b.hs+gauss()*3,15,40),clutch_pct:clamp(13+d*25+gauss()*3.5,4,30)};
}
function agentPool(role,flexRole,r,rounds){
  const of = ro => shuffle(AGENTS.filter(a=>a.role===ro));
  let picks = flexRole ? [...of(role).slice(0,2),...of(flexRole).slice(0,2)] : of(role).slice(0,3);
  let w = picks.map((_,i)=>Math.pow(.5,i)*(0.7+R()*.6)); const s=w.reduce((a,b)=>a+b,0);
  return picks.map((a,i)=>({agent_id:a.agent_id,usage:w[i]/s,rounds:Math.round(rounds*w[i]/s),rating:r+gauss()*.05,acs:ROLE_BASE[a.role].acs+(r-1)*240+gauss()*9}))
    .sort((a,b)=>b.usage-a.usage);
}
const PLAYERS=[]; let hIdx=0;
function makePlayer({team,role,flex,region,bias,rookie,ctry}){
  const pid=PLAYERS.length+1;
  const country = ctry || (R()<.7 && team ? team.country_code : pick(REGION_CTRY[region]));
  const [fn,ln]=NAMES[country];
  let r = clamp(1+bias+gauss()*(rookie?.035:.05),.82,1.32);
  const statRole = flex ? flex : role;
  const rounds = rookie ? 260+Math.floor(R()*380) : 700+Math.floor(R()*1500);
  const st = makeStats(statRole,r,rounds);
  const flexSecond = flex ? pick(ROLES.filter(x=>x!==flex && x!=='controller')) : null;
  const p = {player_id:pid,vlr_player_id:9000+pid*13,ign:HANDLES[hIdx++],real_name:pick(fn)+' '+pick(ln),country_code:country,
    current_team_id:team?team.team_id:null,region,tier:team?team.tier:'Free agent',
    role: flex ? 'flex' : role, statRole, rookie:!!rookie, stats:st,
    agents: agentPool(statRole, flexSecond, r, rounds),
    maps: Object.fromEntries(MAPS.map(m=>[m.map_id, r + (team? team.aff[m.map_id]/900 : 0) + gauss()*.06])),
    total_winnings_usd: Math.round((team&&team.tier==='VCT' ? 25000+R()*140000 : 1500+R()*22000)/100)*100,
    history:[]};
  let trend=gauss()*.012, f=[]; for(let i=0;i<10;i++) f.push(clamp(r+trend*(i-5)+gauss()*.14,.45,1.9)); p.form=f;
  // historique (player_team_membership)
  const since = team ? `202${R()<.5?5:6}-0${1+Math.floor(R()*8)}-1${Math.floor(R()*9)}` : null;
  if(team) p.history.push({team:team.name,team_id:team.team_id,from:since,to:null,current:true});

const eloP = d => 1/(1+Math.pow(10,-d/400));
function veto(pA,fmt){
  const pool=MAPS.map(m=>m.map_id), steps=[], played=[];
  const seq = fmt===1?['A ban','B ban','A ban','B ban','A ban','B ban']:fmt===3?['A ban','B ban','A pick','B pick','A ban','B ban']:['A ban','B ban','A pick','B pick','A pick','B pick'];
  seq.forEach(s=>{
    const [who,act]=s.split(' '); const sc=m=>who==='A'?pA[m]:1-pA[m];
    const best=pool.reduce((a,m)=>(act==='pick'?sc(m)>sc(a):sc(m)<sc(a))?m:a);
    pool.splice(pool.indexOf(best),1); steps.push({who,act,map:best}); if(act==='pick') played.push({map:best,by:who});
  });
  steps.push({who:null,act:'decider',map:pool[0]}); played.push({map:pool[0],by:null});
  return {steps,played};
}

function pct(arr,v){let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(arr[m]<=v)lo=m+1;else hi=m;}return lo/arr.length*100;}
function pctOf(k,v,role){const p=pct(role?DIST_ROLE[role][k]:DIST[k],v);return LOWER_BETTER[k]?100-p:p;}

const form5 = p => mean(p.form.slice(-5));

    players:slots.map(s=>({p:PL[s.player_id],agent:s.agent_id})),compo:true,eloLabel:'Rating estimé'};

function mapPred(A,B,m){
  const e=.6*(A.elo-B.elo), mp=300*(A.wr[m]-B.wr[m]), f=500*(A.form-B.form);
  return {p:eloP(e+mp+f),e,mp,f};
}
function seriesPred(A,B,fmt){
  const pA=Object.fromEntries(MAPS.map(m=>[m.map_id,mapPred(A,B,m.map_id).p]));
  const v=veto(pA,fmt); const need=Math.ceil(fmt/2);
  const ps=v.played.map(x=>pA[x.map]);
  let states={'0-0':1}; const out={};
  ps.forEach(p=>{const nx={};Object.entries(states).forEach(([k,val])=>{const [a,b]=k.split('-').map(Number);
    if(a===need||b===need){out[k]=(out[k]||0)+val;return;}
    nx[`${a+1}-${b}`]=(nx[`${a+1}-${b}`]||0)+val*p; nx[`${a}-${b+1}`]=(nx[`${a}-${b+1}`]||0)+val*(1-p);}); states=nx;});
  Object.entries(states).forEach(([k,val])=>out[k]=(out[k]||0)+val);
  const win=Object.entries(out).filter(([k])=>+k.split('-')[0]===need).reduce((s,[,x])=>s+x,0);
  const parts=v.played.map(x=>mapPred(A,B,x.map));
  return {win,dist:out,veto:v,pA,factors:{e:mean(parts.map(x=>x.e)),mp:mean(parts.map(x=>x.mp)),f:mean(parts.map(x=>x.f))}};
}
function analyseDraft(slots){
  const filled=slots.map((s,i)=>({...s,i})).filter(s=>s.player_id);
  const ps=filled.map(s=>PL[s.player_id]);
  const alerts=[]; const parts={feu:0,entry:0,util:0,clutch:0,balance:100};
  if(!ps.length) return {score:0,parts,alerts:[{lvl:'info',t:'Ajoutez des joueurs depuis la liste pour lancer l’analyse.'}],maps:{},avg:0};
  parts.feu = mean(ps.map(p=>(pctOf('rating',p.stats.rating)+pctOf('acs',p.stats.acs))/2));
  const entries=ps.map(p=>(pctOf('fkpr',p.stats.fkpr)+pctOf('fdpr',p.stats.fdpr))/2).sort((a,b)=>b-a);
  parts.entry = mean(entries.slice(0,2));
  parts.util = mean(ps.map(p=>(pctOf('apr',p.stats.apr)+pctOf('kast_pct',p.stats.kast_pct))/2));
  parts.clutch = mean(ps.map(p=>pctOf('clutch_pct',p.stats.clutch_pct)));
  const agentRoles=filled.map(s=>AG[s.agent_id]?.role);
  let bal=100;
  if(filled.length===5){
    if(!agentRoles.includes('controller')){bal-=35;alerts.push({lvl:'crit',t:'Aucun contrôleur : pas de smokes pour exécuter ou retarder.'});}
    if(!agentRoles.includes('initiator')){bal-=20;alerts.push({lvl:'warn',t:'Aucun initiateur : peu d’info et de flashs pour ouvrir les sites.'});}
    if(!agentRoles.includes('sentinel')){bal-=20;alerts.push({lvl:'warn',t:'Aucune sentinelle : flanc et retakes fragiles.'});}
    if(!agentRoles.includes('duelist')){bal-=15;alerts.push({lvl:'warn',t:'Aucun duelliste : entrées sur site plus lentes.'});}
  } else alerts.push({lvl:'info',t:`${5-filled.length} slot${5-filled.length>1?'s':''} vide${5-filled.length>1?'s':''} : la note est provisoire.`});
  const seen={}; filled.forEach(s=>{ if(seen[s.agent_id]){bal-=30;alerts.push({lvl:'crit',t:`${AG[s.agent_id].name} est choisi deux fois.`});} seen[s.agent_id]=1; });
  filled.forEach(s=>{const p=PL[s.player_id]; if(!p.agents.some(a=>a.agent_id===s.agent_id)){bal-=8;alerts.push({lvl:'warn',t:`${p.ign} n’a pas joué ${AG[s.agent_id].name} en match officiel sur la période.`});}});
  parts.balance=clamp(bal,0,100);
  ps.forEach(p=>{ if(p.rookie) alerts.push({lvl:'info',t:`${p.ign} : ${p.stats.rounds_played} rounds seulement, échantillon limité.`}); });
  const contracted=ps.filter(p=>p.current_team_id); if(contracted.length) alerts.push({lvl:'info',t:`Sous contrat : ${contracted.map(p=>`${p.ign} (${TM[p.current_team_id].short_tag})`).join(', ')}. Transfert à négocier.`});
  const fa=ps.filter(p=>!p.current_team_id).length; if(fa) alerts.push({lvl:'ok',t:`${fa} free agent${fa>1?'s':''} : recrutement possible sans indemnité.`});
  if(!alerts.some(a=>a.lvl==='crit'||a.lvl==='warn')&&filled.length===5) alerts.unshift({lvl:'ok',t:'Rôles couverts et agents cohérents avec les pools des joueurs.'});
  const score=Math.round((parts.feu*.35+parts.entry*.15+parts.util*.2+parts.clutch*.1)*(filled.length/5)+parts.balance*.2);
  const avg=mean(ps.map(p=>p.stats.rating));
  const maps={}; if(filled.length===5){const elo=1750+(avg-1)*2500-(100-parts.balance)*1.5; MAPS.forEach(m=>{const wr=clamp(.5+(mean(ps.map(p=>p.maps[m.map_id]))-avg)*3,.25,.75); maps[m.map_id]=eloP(.6*(elo-1750)+300*(wr-.5));});}
  return {score,parts,alerts,maps,avg};
}

function scList(){

}

  const ts=TEAMS.filter(t=>rg==='all'||t.region===rg).sort((a,b)=>b.elo-a.elo);
  return `
  <div class="sec-h"><div><div class="h-eyebrow">Classement</div><h1 class="h2" style="font-size:40px">Équipes</h1></div>
  <div class="tabs">${['all',...Object.keys(REGION_CTRY)].map(r=>`<button data-act="rank" data-v="${r}" class="${rg===r?'on':''}">${r==='all'?'Monde':r}</button>`).join('')}</div></div>
  <div class="card"><div class="card-h"><h3>${rg==='all'?'Classement mondial':'Région '+rg}</h3>${src('team_rankings')}</div><div class="tscroll"><table class="tbl"><thead><tr>
    <th class="l">#</th><th class="l">Équipe</th><th class="l">Région</th><th class="l">Tier</th><th>Rating</th><th>V–D</th><th class="l">5 derniers</th><th>Série</th><th>Meilleure map</th><th>Gains</th></tr></thead><tbody>
    ${ts.map((t,i)=>{const best=MAPS.map(m=>({m,r:t.mapRec[m.map_id]})).filter(x=>x.r.played>=3).sort((a,b)=>b.r.won/b.r.played-a.r.won/a.r.played)[0];
      return `<tr data-act="team" data-id="${t.team_id}"><td class="l num" style="font-family:var(--f-display);font-size:20px;color:var(--muted)">${rg==='all'?i+1:t.rank}</td>
      <td class="l"><div class="pcell">${ctry(t.country_code)}<div><b>${esc(t.name)}</b><br><small>${t.short_tag}</small></div></div></td>
      <td class="l">${t.region}</td><td class="l"><span class="pill ${t.tier==='VCT'?'vct':'ct'}">${t.tier}</span></td>
      <td class="hl">${t.elo}</td><td>${t.wins}–${t.losses}</td>
      <td class="l"><span class="form5">${t.recent.map(r=>`<span class="wl ${r==='W'?'w':'l'}">${r==='W'?'V':'D'}</span>`).join('')}</span></td>
      <td>${t.streak.len} ${t.streak.type==='W'?'V':'D'}</td>
      <td>${best?`${best.m.name} <span style="color:var(--dim)">${Math.round(best.r.won/best.r.played*100)}%</span>`:'—'}</td><td>${money(t.earnings_usd)}</td></tr>`;}).join('')}
  </tbody></table></div></div>`;
}

/* ---------- Fiches (tiroir) ---------- */
function radarSvg(p){
  const axes=[['rating','Rating'],['acs','ACS'],['kast_pct','KAST'],['adr','ADR'],['fkpr','First kills'],['clutch_pct','Clutch']];
  const vals=axes.map(([k])=>pctOf(k,p.stats[k],p.statRole)/100);
  const pt=(i,r)=>{const a=(-90+i*60)*Math.PI/180;return [Math.cos(a)*r*88,Math.sin(a)*r*88];};
  const ring=r=>axes.map((_,i)=>pt(i,r).map(n=>n.toFixed(1)).join(',')).join(' ');
  return `<svg class="radar" viewBox="-152 -118 304 236" role="img" aria-label="Profil en percentiles face aux ${ROLE_FR[p.statRole]}s">
    ${[.25,.5,.75,1].map(r=>`<polygon points="${ring(r)}" fill="none" stroke="${r===1?'#5C6B78':'rgba(236,232,225,.10)'}" stroke-width="${r===1?1.4:1}"/>`).join('')}
    ${axes.map((_,i)=>{const [x,y]=pt(i,1);return `<line x1="0" y1="0" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(236,232,225,.08)"/>`;}).join('')}
    <polygon points="${vals.map((v,i)=>pt(i,Math.max(.04,v)).map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="rgba(255,70,85,.22)" stroke="#FF4655" stroke-width="2"/>
    ${vals.map((v,i)=>{const [x,y]=pt(i,Math.max(.04,v));return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#ECE8E1"/>`;}).join('')}
    ${axes.map(([,l],i)=>{const [x,y]=pt(i,1.17);return `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="${Math.abs(x)<5?'middle':x>0?'start':'end'}">${l.toUpperCase()} ${Math.round(vals[i]*100)}</text>`;}).join('')}
  </svg>`;
}
function sparkSvg(f){
  const W=260,H=70,lo=.5,hi=1.7; const x=i=>8+i*(W-16)/(f.length-1), y=v=>H-6-(clamp(v,lo,hi)-lo)/(hi-lo)*(H-14);
  const pts=f.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rating sur les 10 dernières maps">
    <line x1="0" x2="${W}" y1="${y(1)}" y2="${y(1)}" stroke="rgba(236,232,225,.22)" stroke-dasharray="3 4"/>
    <text x="${W-2}" y="${y(1)-4}" text-anchor="end" fill="#66737F" font-size="9">1.00</text>
    <polygon points="${x(0)},${H} ${pts} ${x(f.length-1)},${H}" fill="rgba(255,70,85,.12)"/>
    <polyline points="${pts}" fill="none" stroke="#FF4655" stroke-width="2"/>
    ${f.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i===f.length-1?4:2}" fill="${i===f.length-1?'#ECE8E1':'#FF4655'}"/>`).join('')}
  </svg>`;
}
function openDrawer(html){const d=$('#drawer');d.innerHTML=html;d.hidden=false;$('#scrim').hidden=false;d.scrollTop=0;document.body.style.overflow='hidden';$('.close',d)?.focus();}
function closeDrawer(){$('#drawer').hidden=true;$('#scrim').hidden=true;document.body.style.overflow='';}
function openPlayer(id){
  const p=PL[id], s=p.stats; const team=p.current_team_id?TM[p.current_team_id]:null;
  const tile=(l,v,k)=>`<div><span>${l}</span><b>${v}</b><small>Top ${Math.max(1,100-Math.round(pctOf(k,s[k],p.statRole)))}% ${ROLE_FR[p.statRole].toLowerCase()}s</small></div>`;
  const maps=MAPS.map(m=>({m,v:p.maps[m.map_id]})).sort((a,b)=>b.v-a.v);
  openDrawer(`
  <div class="dr-h"><button class="close" data-act="close" aria-label="Fermer">×</button>
    <div class="meta">${ctry(p.country_code)}${roleTag(p.role)}${statusPill(p)}${p.rookie?'<span class="pill rk">Rookie</span>':''}</div>
    <div class="ign">${esc(p.ign)}</div>
    <div class="meta"><span>${esc(p.real_name)}</span><span>·</span><span>${team?teamBtn(team.team_id):'Sans équipe'}</span><span>·</span><span class="num">${s.rounds_played} rounds · gains ${money(p.total_winnings_usd)}</span></div>
  </div>
  <div class="dr-b">
    <div class="tiles num">${tile('Rating',f2(s.rating),'rating')}${tile('ACS',f0(s.acs),'acs')}${tile('K/D',f2(s.kd),'kd')}${tile('KAST',fp(s.kast_pct),'kast_pct')}${tile('ADR',f0(s.adr),'adr')}</div>
    <div class="two"><div><h4>Profil ${src('percentiles par rôle')}</h4>${radarSvg(p)}</div>
      <div><h4>Forme · 10 maps ${src('player_map_stats')}</h4>${sparkSvg(p.form)}
        <div class="sub num" style="margin-top:6px">Moyenne 5 dernières : <b style="color:var(--fg)">${f2(form5(p))}</b> · saison ${f2(s.rating)}</div>
        <div class="tiles num" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-top:12px">${tile('FKPR',f2(s.fkpr),'fkpr')}${tile('Clutch',fp(s.clutch_pct),'clutch_pct')}${tile('HS',fp(s.hs_pct),'hs_pct')}</div></div></div>
    <div><h4>Pool d’agents ${src('player_agent_stats')}</h4><div class="tscroll"><table class="tbl"><thead><tr><th class="l">Agent</th><th>Usage</th><th>Rounds</th><th>Rating</th><th>ACS</th></tr></thead><tbody>
      ${p.agents.map(a=>`<tr style="cursor:default"><td class="l">${achip(a.agent_id)}</td><td>${fp(a.usage*100)}</td><td>${a.rounds}</td><td class="hl">${f2(a.rating)}</td><td>${f0(a.acs)}</td></tr>`).join('')}</tbody></table></div></div>
    <div><h4>Rating par map ${src('player_map_stats ⨝ match_maps')}</h4>${maps.map(({m,v})=>{const d=v-s.rating;const w=clamp(Math.abs(d)/.2*50,0,50);return `<div class="mbar"><span>${m.name}</span><div class="tr"><i style="${d>=0?`left:50%;width:${w}%;background:var(--teal)`:`left:${50-w}%;width:${w}%;background:var(--red)`}"></i></div><b>${f2(v)} <small>${d>=0?'+':'−'}${Math.abs(d).toFixed(2)}</small></b></div>`;}).join('')}</div>
    <div><h4>Parcours ${src('player_team_membership')}</h4><div class="hist">${p.history.map(h=>`<div><span>${h.team_id?teamBtn(h.team_id):esc(h.team)}${h.current?' <span class="pill fa" style="margin-left:6px">Actuel</span>':''}</span><span>${h.from.slice(0,7)} → ${h.to?h.to.slice(0,7):'auj.'}</span></div>`).join('')||'<div><span class="sub">Aucune équipe connue</span><span></span></div>'}</div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="to-draft" data-id="${p.player_id}">Ajouter au Draft Maker</button></div>
  </div>`);
}
function openTeam(id){
  const t=TM[id]; const ps=t.roster.map(i=>PL[i]);
  openDrawer(`
  <div class="dr-h"><button class="close" data-act="close" aria-label="Fermer">×</button>
    <div class="meta">${ctry(t.country_code)}<span class="pill ${t.tier==='VCT'?'vct':'ct'}">${t.tier}</span><span>${t.region} · #${t.rank} régional</span></div>
    <div class="ign">${esc(t.name)}</div>
    <div class="meta num"><span>Rating ${t.elo}</span><span>·</span><span>${t.wins}–${t.losses}</span><span>·</span><span>Série ${t.streak.len} ${t.streak.type==='W'?'V':'D'}</span><span>·</span><span>Gains ${money(t.earnings_usd)}</span></div>
  </div>
  <div class="dr-b">
    <div><h4>Roster ${src('player_team_membership · is_current')}</h4><div class="tscroll"><table class="tbl"><thead><tr><th class="l">Joueur</th><th class="l">Rôle</th><th>Rating</th><th>ACS</th><th>KAST</th><th>Forme</th></tr></thead><tbody>
      ${ps.map(p=>`<tr data-act="player" data-id="${p.player_id}"><td class="l"><div class="pcell" style="min-width:0">${ctry(p.country_code)}<b>${esc(p.ign)}</b></div></td><td class="l">${roleTag(p.role)}</td><td class="hl" style="${heat('rating',p.stats.rating)}">${f2(p.stats.rating)}</td><td>${f0(p.stats.acs)}</td><td>${fp(p.stats.kast_pct)}</td><td>${f2(form5(p))}</td></tr>`).join('')}</tbody></table></div></div>
    <div><h4>Winrate par map ${src('v_team_map_record')}</h4>${MAPS.map(m=>{const r=t.mapRec[m.map_id];const wr=r.played?r.won/r.played:.5;const w=Math.abs(wr-.5)*100;return `<div class="mbar"><span>${m.name}</span><div class="tr"><i style="${wr>=.5?`left:50%;width:${w}%;background:var(--teal)`:`left:${50-w}%;width:${w}%;background:var(--red)`}"></i></div><b>${r.played?fp(wr*100):'—'} <small>${r.won}/${r.played}</small></b></div>`;}).join('')}</div>
    <div><h4>Derniers matchs ${src('matches')}</h4><div class="card">${t.matches.slice(0,6).map(m=>{const home=m.team1_id===id;const opp=home?m.team2_id:m.team1_id;const won=m.winner_team_id===id;const a=home?m.team1_score:m.team2_score,b=home?m.team2_score:m.team1_score;
      return `<div class="rrow"><span class="nm"><span class="wl ${won?'w':'l'}">${won?'V':'D'}</span><span class="sub num">${dShort(m.match_date)}</span>${teamBtn(opp)}</span><b class="num">${a}–${b}</b></div>`;}).join('')}</div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="predict" data-a="team:${id}" data-b="${state.pred.b==='team:'+id?state.pred.a:state.pred.b}">Prédire un match</button></div>
  </div>`);
}

/* =====================================================================
   5. ROUTAGE & ÉVÉNEMENTS
   ===================================================================== */
const VIEWS={accueil:renderHome,scouting:renderScouting,draft:renderDraft,predictions:renderPredictions,classement:renderClassement};
function route(){
  let v=location.hash.slice(1); if(!VIEWS[v]) v='accueil';
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  $('#view').innerHTML=VIEWS[v]();
  if(v==='scouting') renderScTable();
  if(v==='draft') refreshDraft();
  if(v==='predictions') renderPredOut();
  window.scrollTo(0,0);
}
let toastT; function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2200);}
function go(v){ if(location.hash==='#'+v) route(); else location.hash=v; }
function placeInDraft(id){
  const d=state.draft; const p=PL[id];
  if(d.slots.some(s=>s.player_id===id)){toast(`${p.ign} est déjà dans la composition`);return false;}
  let i=d.selected; if(d.slots[i].player_id){const e=d.slots.findIndex(s=>!s.player_id); if(e>=0) i=e;}
  const taken=d.slots.filter((_,j)=>j!==i).map(s=>s.agent_id);
  d.slots[i]={player_id:id,agent_id:defaultAgent(p,SLOT_ROLES[i],taken)};
  const nx=d.slots.findIndex(s=>!s.player_id); d.selected=nx>=0?nx:i; return true;
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, id=+el.dataset.id;
  switch(a){
    case 'player': openPlayer(id); break;
    case 'team': openTeam(id); break;
    case 'close': closeDrawer(); break;
    case 'dev': {const on=document.body.classList.toggle('dev'); el.setAttribute('aria-pressed',on); el.textContent=on?'Masquer les tables SQL':'Afficher les tables SQL'; break;}
    case 'predict': state.pred.a=el.dataset.a; state.pred.b=el.dataset.b; closeDrawer(); go('predictions'); break;
    case 'to-draft': if(placeInDraft(id)){persist();closeDrawer();go('draft');toast(`${PL[id].ign} ajouté à la composition`);} break;
    case 'slot': if(e.target.closest('select,.link')) break; state.draft.selected=+el.dataset.i; renderSlots(); renderPool(); break;
    case 'slot-clear': e.stopPropagation(); state.draft.slots[+el.dataset.i]={player_id:null,agent_id:null}; state.draft.selected=+el.dataset.i; refreshDraft(); break;
    case 'pool-add': if(placeInDraft(id)) refreshDraft(); break;
    case 'save': {const n=($('#compo-name').value||'').trim()||`Composition ${state.saved.length+1}`; state.draft.name=n;
      const ex=state.saved.findIndex(s=>s.name===n); const copy=JSON.parse(JSON.stringify({name:n,slots:state.draft.slots}));
      if(ex>=0) state.saved[ex]=copy; else state.saved.push(copy); refreshDraft(); toast(ex>=0?'Composition mise à jour':'Composition sauvegardée'); break;}
    case 'load': {const c=state.saved[+el.dataset.i]; state.draft={name:c.name,slots:JSON.parse(JSON.stringify(c.slots)),selected:0}; refreshDraft(); toast(`« ${c.name} » chargée`); break;}
    case 'del': {const c=state.saved.splice(+el.dataset.i,1)[0]; refreshDraft(); toast(`« ${c.name} » supprimée`); break;}
    case 'draft-reset': state.draft={name:'',slots:SLOT_ROLES.map(()=>({player_id:null,agent_id:null})),selected:0}; refreshDraft(); break;
    case 'draft-example': state.draft=exampleDraft(); refreshDraft(); break;
    case 'draft-predict': state.pred.a='draft'; if(!state.pred.b.startsWith('team:')) state.pred.b='team:1'; go('predictions'); break;
    case 'fmt': state.pred.fmt=+el.dataset.v; document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b===el)); renderPredOut(); break;
    case 'swap': [state.pred.a,state.pred.b]=[state.pred.b,state.pred.a]; $('#pr-a').value=state.pred.a; $('#pr-b').value=state.pred.b; renderPredOut(); break;
    case 'rank': state.rank.region=el.dataset.v; route(); break;
    case 'search-go': $('#sres').hidden=true; $('#gsearch').value=''; el.dataset.kind==='p'?openPlayer(id):openTeam(id); break;
  }
});
document.addEventListener('click',e=>{ const th=e.target.closest('th[data-sort]'); if(!th) return; const k=th.dataset.sort; const s=state.sc;
  if(s.sort===k) s.dir*=-1; else {s.sort=k; s.dir=(k==='ign'||k==='fdpr')?1:-1;} renderScTable(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDrawer();$('#sres').hidden=true;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.slot[role=button]')){e.preventDefault();e.target.click();}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='sc-q'){state.sc.q=t.value;renderScTable();}
  if(t.id==='pool-q'){state.pool.q=t.value;renderPool();}
  if(t.id==='compo-name'){state.draft.name=t.value;persist();}
  if(t.id==='gsearch'){
    const q=t.value.trim().toLowerCase(), box=$('#sres'); if(!q){box.hidden=true;return;}
    const r=[...TEAMS.filter(x=>x.name.toLowerCase().includes(q)||x.short_tag.toLowerCase()===q).map(x=>({k:'t',id:x.team_id,l:x.name,s:'Équipe',c:x.country_code})),
             ...PLAYERS.filter(p=>p.ign.toLowerCase().includes(q)).map(p=>({k:'p',id:p.player_id,l:p.ign,s:p.current_team_id?TM[p.current_team_id].short_tag:'Free agent',c:p.country_code}))].slice(0,8);
    box.innerHTML=r.length?r.map(x=>`<button data-act="search-go" data-kind="${x.k}" data-id="${x.id}">${ctry(x.c)}<span>${esc(x.l)}</span><span class="k">${esc(x.s)}</span></button>`).join(''):`<div class="empty">Aucun résultat pour « ${esc(t.value)} »</div>`;
    box.hidden=false;
  }
});
document.addEventListener('change',e=>{
  const t=e.target, v=t.value;
  if(t.id==='sc-region'){state.sc.region=v;renderScTable();}
  if(t.id==='sc-role'){state.sc.role=v;renderScTable();}
  if(t.id==='sc-status'){state.sc.status=v;renderScTable();}
  if(t.id==='sc-min'){state.sc.min=+v;renderScTable();}
  if(t.id==='pool-role'){state.pool.role=v;renderPool();}
  if(t.id==='pool-status'){state.pool.status=v;renderPool();}
  if(t.id&&t.id.startsWith('slot-agent-')){const i=+t.id.slice(11);state.draft.slots[i].agent_id=+v;refreshDraft();}
  if(t.id==='pr-a'){state.pred.a=v;renderPredOut();}
  if(t.id==='pr-b'){state.pred.b=v;renderPredOut();}
});
document.addEventListener('click',e=>{ if(!e.target.closest('.search')) $('#sres').hidden=true; },true);
window.addEventListener('hashchange',()=>{closeDrawer();route();});
route();
</script>
